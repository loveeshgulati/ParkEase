services:
  # ─────────────────────────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: parkease-auth
    runtime: docker
    dockerfilePath: ./ParkEase.Auth/Dockerfile
    dockerContext: ./ParkEase.Auth
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        value: "Host=dpg-d7is8kvaqgkc73a4d3f0-a.virginia-postgres.render.com;Port=5432;Database=parkease_auth;Username=parkease_yfo2_user;Password=EVSwWebkrsxGPZiLjqGsnYxh8eEcFn0W;SSL Mode=Require;Trust Server Certificate=true"
      - key: Jwt__Secret
        value: "ParkEase_SuperSecret_JWT_Key_MinLength32Chars!"
      - key: Jwt__Issuer
        value: ParkEase.Auth
      - key: Jwt__Audience
        value: ParkEase.Client
      - key: Jwt__ExpiryHours
        value: "24"
      - key: RabbitMQ__Host
        value: shrimp.rmq.cloudamqp.com
      - key: RabbitMQ__Username
        value: uqfenpdj
      - key: RabbitMQ__VHost
        value: uqfenpdj
      - key: RabbitMQ__Password
        value: cHciJ4wVhs-QytxK9p6i6FnqxHyAwGRY
      - key: Google__ClientId
        value: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
      - key: Google__ClientSecret
        value: "YOUR_GOOGLE_CLIENT_SECRET"

