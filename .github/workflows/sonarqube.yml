name: SonarQube Analysis - Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube Scan (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube blame info

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore ParkEase.sln

      - name: Validate SonarQube Secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN_BACKEND }}" ]; then
            echo "::error::SONAR_TOKEN_BACKEND secret is missing. Please set it in GitHub Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORG: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"parkease-backend" \
            /o:"$SONAR_ORG" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="coverage/coverage.opencover.xml" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs,**/Data/**,**/Models/**,**/DTOs/**,**/Repositories/**,**/Controllers/**,**/Properties/**,**/*Program.cs,**/*Startup.cs,**/Middleware/**,**/Consumers/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/*Program.cs,**/Data/**,**/Models/**,**/DTOs/**,**/Repositories/**,**/Controllers/**,**/*Program.cs,**/*Startup.cs,**/Middleware/**,**/Consumers/**" \
            /d:sonar.cpd.exclusions="**/*Program.cs,**/*Startup.cs,**/Data/**,**/Models/**,**/DTOs/**,**/Repositories/**,**/Controllers/**,**/Middleware/**,**/Consumers/**"

      - name: Build solution
        run: dotnet build ParkEase.sln --no-incremental -c Release

      - name: Run tests with coverage
        run: |
          dotnet test ParkEase.Tests/ParkEase.Tests.csproj \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          # Flatten coverage file to expected path
          find ./coverage -name "coverage.opencover.xml" -exec cp {} ./coverage/coverage.opencover.xml \;

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
